<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Track Orders | The Indian Stone Art</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1a1512; --accent: #c5a059; --bg-light: #fdfbf7; }
        body { font-family: 'Montserrat', sans-serif; margin: 0; background-color: var(--bg-light); }
        header { background-color: var(--primary); padding: 1rem 2rem; border-bottom: 2px solid var(--accent); }
        .nav-container { max-width: 1200px; margin: auto; display: flex; justify-content: space-between; align-items: center; }
        .brand-title { font-family: 'Cinzel', serif; font-size: 1.3rem; color: #fff; text-decoration: none; }
        nav a { color: #dcd6cd; text-decoration: none; margin-left: 20px; font-size: 0.85rem; text-transform: uppercase; }

        .container { max-width: 650px; margin: 4rem auto; background: #fff; padding: 2.5rem; border: 1px solid #e0d9cf; border-top: 4px solid var(--accent); }
        .form-group { margin-bottom: 1.2rem; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; box-sizing: border-box; }
        .btn-search { background: var(--accent); color: var(--primary); border: none; padding: 12px; width: 100%; font-weight: bold; cursor: pointer; }
        .result-box { margin-top: 2rem; padding: 1.5rem; background: #faf8f5; border: 1px solid #eae2d8; display: none; }
        .status-badge { display: inline-block; padding: 4px 12px; background: #e8f5e9; color: #2e7d32; font-weight: bold; font-size: 0.85rem; }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="brand-title">THE INDIAN STONE ART</a>
            <nav>
                <a href="index.html">Home</a>
                <a href="collection.html">Catalog</a>
                <a href="track.html" style="color:var(--accent);">Track Order</a>
                <a href="login.html">Login</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <h2 style="font-family:'Cinzel', serif; text-align:center;">Track Order Status</h2>
        <div class="form-group">
            <label style="font-weight:bold;">Enter Registered Phone Number or Order ID</label>
            <input type="text" id="trackInput" placeholder="e.g. +91-9636567813 or Transaction ID">
        </div>
        <button class="btn-search" onclick="findOrder()">SEARCH LIVE ORDER</button>

        <div id="resultBox" class="result-box">
            <h3>Order Details</h3>
            <p><strong>Status:</strong> <span class="status-badge">Processing / Artisan Crafting</span></p>
            <p><strong>Estimated Shipping:</strong> 3-5 Business Days</p>
            <p><strong>Workshop Location:</strong> Chandrawati, Rajasthan</p>
            <hr>
            <p style="font-size:0.85rem; color:#666;">Need live update? Contact workshop directly via WhatsApp +91-963-656-7813.</p>
        </div>
    </div>

    <script>
        function findOrder() {
            var val = document.getElementById('trackInput').value;
            if(val.trim() === '') {
                alert('Please enter your phone number or Order ID');
                return;
            }
            document.getElementById('resultBox').style.display = 'block';
        }
    </script>
</body>
</html>
